[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aem-waf-cdn-agent"
version = "0.1.0"
description = "Agent for AEM-specific WAF/CDN rule analysis, validation, and generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "fastapi",
  "uvicorn",
  "mcp",
]

[project.scripts]
aem-waf-cdn-agent = "aem_waf_cdn_agent.cli:main"
aem-waf-cdn-agent-api = "aem_waf_cdn_agent.api:run"
aem-waf-cdn-agent-mcp = "aem_waf_cdn_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["aem_waf_cdn_agent*"]
